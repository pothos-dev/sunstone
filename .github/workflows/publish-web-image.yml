name: Publish Web Image

# Build the Sunstone Web image and push it multi-arch to GHCR (ghcr.io).
#
# Runs on the same v* tags as the desktop release flow (release.yml), and can be
# triggered manually via workflow_dispatch (optionally overriding the tag). This
# is a standalone job — it does NOT wait on the Tauri installer build.
#
# Uses the repo-scoped GITHUB_TOKEN — no maintainer-provided secret required.
# The image is pushed to ghcr.io/<repository_owner>/sunstone-web; see
# docker/README.md → "Publishing to GHCR" for the one-time step to make the
# package public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.14.0). Defaults to latest."
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  publish-web-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sunstone-web"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push (v1.2.3) → publish :1.2.3 and :latest.
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            # Manual run → publish the requested tag (default latest).
            TAG="${{ github.event.inputs.tag }}"
            TAGS="${IMAGE}:${TAG:-latest}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          # ignore-error: the cache export runs AFTER the image has been pushed, so
          # without it a cache-side hiccup fails the job on work that already
          # succeeded — v0.19.0 published both tags and still went red with
          # "exporting to GitHub Actions Cache: ERROR: not_found". A build cache is
          # an optimisation; losing it must not mean losing the release.
          cache-to: type=gha,mode=max,ignore-error=true
