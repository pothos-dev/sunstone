[package]
name = "sunstone-cli"
version = "0.29.0"
description = "Headless `sunstone serve`: the editor in a browser, without the Tauri shell — the binary the npm package ships"
authors = ["Daniel Allmer <daniel@pothos.dev>"]
edition = "2021"

[[bin]]
name = "sunstone-cli"
path = "src/main.rs"

[dependencies]
sunstone-server = { path = "../sunstone-server" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# The static SPA build (`bun run build` → `build/`), compiled into release
# binaries. Debug builds read it from disk instead, so `cargo check` and
# `cargo test` need no frontend build.
rust-embed = "8"
