[package]
name = "sunstone-server"
version = "0.21.0"
description = "HTTP server exposing a Sunstone Bundle over sunstone-native (Sunstone Web, and the desktop's `sunstone serve`)"
authors = ["Daniel Allmer <daniel@pothos.dev>"]
edition = "2021"

# A library too: the desktop binary links it for `sunstone serve` (`serve_local`).
[lib]
name = "sunstone_server"
path = "src/lib.rs"

[[bin]]
name = "sunstone-server"
path = "src/main.rs"

[dependencies]
# Sunstone's reusable domain logic — the SAME bundle/index code the desktop uses.
sunstone-native = { path = "../sunstone-native" }
# `url::query_encode` — the ONE percent-encoder, shared with the desktop shell,
# so `/api/asset?path=…` is built exactly as `http.ts` builds it (ei-1).
sunstone-shared = { path = "../sunstone-shared" }
axum = "0.8"
# `time` is for the sync loop's notify-with-timeout tick scheduling (Spec 2 §8.1).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Wrap a broadcast receiver as a Stream for the SSE (`/api/events`) route.
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { workspace = true }
serde_json.workspace = true
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.22.1"

[features]
# Test-harness knobs compiled out of every shipped binary. `e2e` lets the web e2e
# suite point a git shape at a temp repo (`SUNSTONE_E2E_REPO_DIR`, see config).
e2e = []

[dev-dependencies]
# `ServiceExt::oneshot` — drive the whole local-mode router in tests (axum's own dep).
tower = { version = "0.5", features = ["util"] }
