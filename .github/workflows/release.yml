name: Release

on:
  push:
    tags:
      - "v*"

# `vite build` runs out of V8's default heap on the macOS runners (every
# macOS job of v0.30.0–v0.30.3 died with "JavaScript heap out of memory").
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const body =
              process.env.RELEASE_BODY.trim() ||
              "See the assets to download and install this version.";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Sunstone ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            core.setOutput("release_id", data.id);

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      # The browser wasm module. `vite build` — which tauri-action runs as its
      # beforeBuildCommand — imports the wasm-pack `--target web` output at
      # `$lib/wasm/pkg` as a HARD dependency (ADR 0006 §1), and pkg/ is generated,
      # never committed. Without these three steps every platform fails in
      # vite:load-fallback with "Could not load src/lib/wasm/pkg", which is exactly
      # how v0.18.0 shipped with no installers at all. The Dockerfile builds the
      # same artifact for the web image; that is why Publish Web Image kept passing
      # while this job did not.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Build the browser wasm module
        run: bun run build:wasm

      # `createUpdaterArtifacts` in tauri.conf.json makes tauri-action sign the
      # installers with this key (public half in the same file) and merge every
      # platform into the release's `latest.json`, the feed the in-app updater
      # polls. The private key lives outside the repo; losing it strands every
      # installed copy on its current version.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # The headless `sunstone-cli` binary (`sunstone serve` without Tauri) for the
  # npm package — `npx sunstone-md ./docs`. Linux builds are static musl so
  # they run on any distro.
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, npm: linux-x64, exe: sunstone-cli }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64, exe: sunstone-cli }
          - { runner: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64, exe: sunstone-cli }
          - { runner: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64, exe: sunstone-cli }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64, exe: sunstone-cli.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The static SPA the binary embeds (`build/`); needs the wasm module first,
      # as in build-tauri.
      - name: Build the frontend
        shell: bash
        run: |
          bun install
          cargo install wasm-pack --locked --version 0.15.0
          bun run build:wasm
          bun run build

      - name: Build sunstone-cli
        run: cargo build --release --locked -p sunstone-cli --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.npm }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  # Publishes the npm packages via trusted publishing (GitHub OIDC, no token).
  # The platform packages publish directly; their trusted-publisher config
  # allows `npm publish`. They do nothing until a launcher points at them (it
  # pins exact versions) and a published version can't be replaced. The
  # launcher is only staged (its config allows `npm stage publish` alone): a
  # maintainer approves it with 2FA, which is what makes the release reach
  # `npx sunstone-md`. Trusted publishing needs npm >= 11.5 and staging
  # >= 11.15. A package must already exist on the registry to configure its
  # trusted publisher, so a brand-new platform package needs one manual
  # `npm publish` first. Platform versions already on the registry are skipped,
  # so a re-run picks up where a failed run stopped; the launcher is staged
  # only once every platform package is live.
  publish-npm:
    needs: build-cli
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install an npm that can stage
        run: npm install -g npm@^11.15.0

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: bins

      - name: Publish the platform packages, stage the launcher
        run: |
          version="${GITHUB_REF_NAME#v}"
          for d in bins/cli-*; do mv "$d" "bins/${d#bins/cli-}"; done
          node npm/stage.mjs "$version" bins npm-out
          launcher=$(node -p 'require("./npm/sunstone/package.json").name')
          failed=""
          for dir in ./npm-out/*; do
            [ "$dir" = "./npm-out/$launcher" ] && continue
            name=$(node -p "require('$dir/package.json').name")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published"
            else
              (cd "$dir" && npm publish) || failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::could not publish:$failed (launcher not staged)"
            exit 1
          fi
          (cd "./npm-out/$launcher" && npm stage publish)

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
